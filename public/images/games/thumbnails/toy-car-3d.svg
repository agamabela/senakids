<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#81ecec" />
      <stop offset="60%" stop-color="#dfe6e9" />
      <stop offset="100%" stop-color="#55efc4" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0984e3" />
      <stop offset="100%" stop-color="#74b9ff" />
    </linearGradient>
    <linearGradient id="rampGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffeaa7" />
      <stop offset="100%" stop-color="#fdcb6e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Playground -->
  <rect width="400" height="300" rx="24" fill="url(#bgGrad)" />

  <!-- Road Track Circle -->
  <ellipse cx="200" cy="220" rx="170" ry="65" fill="#636e72" stroke="#2d3436" stroke-width="3" />
  <ellipse cx="200" cy="220" rx="110" ry="42" fill="#55efc4" stroke="#2d3436" stroke-width="2" />

  <!-- Ramp -->
  <polygon points="50,230 110,185 130,200 70,245" fill="url(#rampGrad)" stroke="#2d3436" stroke-width="2.5" />

  <!-- Tumbled Wooden Blocks -->
  <g filter="url(#shadow)">
    <rect x="290" y="190" width="22" height="22" rx="4" fill="#ff7675" stroke="#2d3436" stroke-width="2" transform="rotate(15 301 201)" />
    <rect x="315" y="195" width="22" height="22" rx="4" fill="#fdcb6e" stroke="#2d3436" stroke-width="2" transform="rotate(-20 326 206)" />
    <rect x="300" y="172" width="22" height="22" rx="4" fill="#a29bfe" stroke="#2d3436" stroke-width="2" transform="rotate(8 311 183)" />
  </g>

  <!-- Golden Stars & Balloons -->
  <g filter="url(#shadow)">
    <!-- Star -->
    <polygon points="200,60 205,74 219,74 208,82 212,96 200,88 188,96 192,82 181,74 195,74" fill="#fdcb6e" stroke="#e17055" stroke-width="2.5" />
    <!-- Balloon -->
    <ellipse cx="320" cy="90" rx="18" ry="24" fill="#ff7675" />
    <polygon points="318,114 322,114 320,118" fill="#d63031" />
    <path d="M 320 118 Q 325 140 320 165" stroke="#2d3436" stroke-width="2" fill="none" />
  </g>

  <!-- Cute Blue Toy Car (Isometric angle) -->
  <g transform="translate(160, 140)" filter="url(#shadow)">
    <!-- Car shadow -->
    <ellipse cx="40" cy="48" rx="55" ry="16" fill="rgba(0,0,0,0.25)" />

    <!-- Wheels -->
    <rect x="-10" y="28" width="18" height="24" rx="6" fill="#2d3436" />
    <circle cx="-1" cy="40" r="4" fill="#dfe6e9" />

    <rect x="68" y="28" width="18" height="24" rx="6" fill="#2d3436" />
    <circle cx="77" cy="40" r="4" fill="#dfe6e9" />

    <rect x="8" y="38" width="18" height="24" rx="6" fill="#2d3436" />
    <circle cx="17" cy="50" r="4" fill="#dfe6e9" />

    <rect x="84" y="38" width="18" height="24" rx="6" fill="#2d3436" />
    <circle cx="93" cy="50" r="4" fill="#dfe6e9" />

    <!-- Chassis Body -->
    <rect x="0" y="18" width="94" height="26" rx="8" fill="url(#carGrad)" stroke="#2d3436" stroke-width="3" />

    <!-- Cabin Roof -->
    <rect x="22" y="-2" width="48" height="22" rx="6" fill="#ffffff" stroke="#2d3436" stroke-width="3" />
    <!-- Windshield -->
    <rect x="48" y="2" width="18" height="14" rx="3" fill="#81ecec" />
    <rect x="26" y="2" width="18" height="14" rx="3" fill="#81ecec" />

    <!-- Cute Headlights -->
    <circle cx="92" cy="28" r="6" fill="#fff" stroke="#2d3436" stroke-width="2" />
    <circle cx="92" cy="28" r="4" fill="#fff982" />

    <!-- Antenna with Star -->
    <line x1="16" y1="0" x2="10" y2="-22" stroke="#2d3436" stroke-width="2.5" />
    <circle cx="10" cy="-24" r="5" fill="#f1c40f" stroke="#2d3436" stroke-width="1.5" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(200, 260)">
    <rect x="-125" y="-20" width="250" height="40" rx="20" fill="#ffffff" stroke="#2d3436" stroke-width="3" filter="url(#shadow)" />
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#2d3436" text-anchor="middle">
      🚗 TOY CAR PLAYGROUND
    </text>
  </g>
</svg>
