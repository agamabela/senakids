<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgKemdikdasmen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B6CB0"/>
      <stop offset="100%" stop-color="#1A365D"/>
    </linearGradient>
    <filter id="shadowK" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgKemdikdasmen)"/>
  <circle cx="370" cy="50" r="90" fill="#fff" opacity="0.06"/>
  <circle cx="20" cy="250" r="70" fill="#fff" opacity="0.06"/>

  <!-- Education Symbol / Emblem -->
  <g filter="url(#shadowK)" transform="translate(145, 30)">
    <!-- Shield / Badge -->
    <path d="M 55 5 L 105 25 L 105 75 Q 105 110 55 125 Q 5 110 5 75 L 5 25 Z" fill="#ECC94B"/>
    <path d="M 55 12 L 98 30 L 98 73 Q 98 103 55 116 Q 12 103 12 73 L 12 30 Z" fill="#2C5282"/>
    
    <!-- Open Book Inside Badge -->
    <path d="M 25 50 Q 55 55 55 90 Q 55 55 85 50 L 85 85 Q 55 90 55 90 Q 55 90 25 85 Z" fill="#FFFFFF"/>
    <line x1="55" y1="52" x2="55" y2="90" stroke="#ECC94B" stroke-width="2.5"/>
    
    <!-- Torch Flame of Knowledge -->
    <path d="M 55 25 Q 63 35 58 45 Q 52 40 55 25 Z" fill="#F6AD55"/>
    <path d="M 55 30 Q 59 37 56 43 Q 53 40 55 30 Z" fill="#ED8936"/>
  </g>

  <!-- Typography -->
  <text x="200" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF">Buku Nonteks</text>
  <text x="200" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#ECC94B">Kemendikdasmen RI</text>
  <text x="200" y="252" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#E2E8F0">Katalog Buku Pengayaan Resmi</text>
  <text x="200" y="272" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#A0AEC0">Kurikulum Merdeka • Literasi Anak Bangsa</text>
</svg>
