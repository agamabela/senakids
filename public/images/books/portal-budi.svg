<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgBudi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#319795"/>
      <stop offset="100%" stop-color="#234E52"/>
    </linearGradient>
    <filter id="shadowB" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgBudi)"/>
  <circle cx="340" cy="50" r="85" fill="#fff" opacity="0.08"/>
  <circle cx="50" cy="240" r="75" fill="#fff" opacity="0.08"/>

  <!-- Tablet / Digital Book Illustration -->
  <g filter="url(#shadowB)" transform="translate(130, 25)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="140" height="135" rx="14" fill="#FFFFFF"/>
    <rect x="6" y="6" width="128" height="123" rx="10" fill="#E6FFFA"/>
    
    <!-- Screen Graphic: Animated character / book -->
    <path d="M 25 35 Q 70 42 70 95 Q 70 42 115 35 L 115 90 Q 70 98 70 98 Q 70 98 25 90 Z" fill="#319795"/>
    <line x1="70" y1="40" x2="70" y2="98" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Joyful Eyes / Smile for Kids -->
    <circle cx="48" cy="60" r="4" fill="#FFFFFF"/>
    <circle cx="92" cy="60" r="4" fill="#FFFFFF"/>
    <path d="M 64 74 Q 70 80 76 74" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Play / Tap Icon -->
    <circle cx="70" cy="112" r="7" fill="#319795"/>
    <polygon points="68,109 74,112 68,115" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="200" y="200" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF">BUDI</text>
  <text x="200" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#81E6D9">Buku Digital Interaktif</text>
  <text x="200" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#E6FFFA">Kemendikdasmen RI</text>
  <text x="200" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11" fill="#B2F5EA">PAUD &amp; Pendidikan Dasar • Interaktif</text>
</svg>
